name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  check:
    name: Check & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: Format Check
        run: cargo fmt --check

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Cargo Build Release
        run: cargo build --release --verbose

      - name: Test CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/ai-hook.exe --version
            ./target/release/ai-hook.exe -r examples list
          else
            ./target/release/ai-hook --version
            ./target/release/ai-hook -r examples list
          fi
