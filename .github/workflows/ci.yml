name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  check:
    name: Check & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Cargo Build Release
        run: cargo build --release --verbose

      - name: Test CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE=./target/release/ai-hook.exe
          else
            EXE=./target/release/ai-hook
          fi
          "$EXE" --version
          "$EXE" -r examples list
          # End-to-end regression: the `test` subcommand must feed the command
          # line to ctx.cmd. (A missing toolCall.name made ctx.cmd always null,
          # silently disabling every command rule; see review + unit tests.)
          OUT="$("$EXE" test 'rm -rf /' examples/01_basic_regex.js 2>&1)"
          case "$OUT" in
            *"Deny"*) echo "ok: test subcommand evaluates command rules" ;;
            *) echo "FAIL: command rule not enforced"; echo "$OUT"; exit 1 ;;
          esac
