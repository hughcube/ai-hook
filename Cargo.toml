[package]
name = "ai-hook"
version = "2.0.6"
edition = "2024"
authors = ["hugh.li"]
description = "High-performance, multi-agent unified hook dispatcher and autonomous rule engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hughcube/ai-hook"
keywords = ["ai", "agent", "hook", "security", "guardrail"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rquickjs = { version = "0.12", features = ["std"] }
self-replace = "1.5"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Used to verify the SHA256SUMS.txt published alongside each release before a
# downloaded binary is allowed to replace the running executable.
sha2 = "0.10"
hex = "0.4"
# Local-time formatting for log lines (rule debug + inbound payload logs).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
which = "8.0.6"
shlex = "2.0.1"
command-group = "5.0.1"


[features]
# rquickjs ships pre-generated bindings for most targets but NOT for
# i686-pc-windows-msvc; the Windows-32-bit release build enables bindgen
# (requires clang/libclang on the runner) to generate them at build time.
bindgen = ["rquickjs/bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# NOTE: panic must stay unwind so that main() can catch_unwind around the
# embedded JS engine and emit a deny decision instead of empty output
# (empty hook output is treated as "allow" by every host protocol).
strip = true
