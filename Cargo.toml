[package]
name = "ai-hook"
version = "0.1.2"
edition = "2024"
authors = ["hugh.li <hugh.li0001@gmail.com>"]
description = "High-performance, multi-agent unified hook dispatcher and autonomous rule engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hughcube/ai-hook"
keywords = ["ai", "agent", "hook", "security", "guardrail"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rquickjs = { version = "0.12", features = ["std"] }
regex = "1.11"
chrono = "0.4"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
